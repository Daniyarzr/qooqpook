<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0140ff">
    <meta name="color-scheme" content="dark">
    <title>QOOQ VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="static/styles.css?v={{VERSION}}">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div id="app">
        <header class="header">
            <div class="header-top">
                <div class="header-brand">
                    <img src="static/logo.png?v={{VERSION}}" alt="QOOQ" class="brand-logo">
                    <div class="brand-text">
                        <h1>QOOQ VPN</h1>
                        <p class="subtitle">Безопасный доступ без границ</p>
                    </div>
                </div>
                <div id="user-chip" class="user-chip" hidden></div>
            </div>
        </header>

        <main id="screen" class="screen">
            <div class="loader">
                <img src="static/logo.png?v={{VERSION}}" alt="" class="loader-logo">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>
        </main>

        <nav class="bottom-nav" id="nav" hidden>
            <button class="nav-item active" data-tab="home" type="button">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
                <span>Главная</span>
            </button>
            <button class="nav-item" data-tab="plans" type="button">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
                <span>Тарифы</span>
            </button>
            <button class="nav-item" data-tab="devices" type="button">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
                <span>Устройства</span>
            </button>
            <button class="nav-item" data-tab="balance" type="button">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                <span>Баланс</span>
            </button>
            <button class="nav-item" data-tab="profile" type="button">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <div id="modal" class="modal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script>
        window.__QOOQ__ = {
            apiPrefix: "{{API_PREFIX}}",
            version: "{{VERSION}}",
        };
    </script>
    <script src="static/app.js?v={{VERSION}}"></script>
</body>
</html>
